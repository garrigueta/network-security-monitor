version: '3.8'

services:
  attack-simulator:
    build: .
    container_name: attack-simulator
    volumes:
      - ./results:/app/results
      - ./config.yaml:/app/config.yaml:ro
    network_mode: "host"  # Use host network to reach honeypot
    restart: "no"  # Run on-demand only
    environment:
      - PYTHONUNBUFFERED=1
