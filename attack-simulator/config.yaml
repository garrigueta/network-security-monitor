# Attack Simulator Configuration
target:
  host: "192.168.1.135"  # Honeypot host
  ports:
    ssh: 2222
    telnet: 2223
    ftp: 21
    http: 80
    https: 443
    smtp: 25
    pop3: 110
    imap: 143
    imaps: 993
    pop3s: 995
    socks5: 1080
    mysql: 3306
    postgresql: 5432
    vnc: 5900

# Attack scenarios
scenarios:
  - name: "ssh_bruteforce"
    protocol: "ssh"
    enabled: true
    attempts: 10
    delay: 2  # seconds between attempts
    
  - name: "telnet_scan"
    protocol: "telnet"
    enabled: true
    attempts: 5
    delay: 1
    
  - name: "ftp_anonymous"
    protocol: "ftp"
    enabled: true
    attempts: 3
    delay: 2
    
  - name: "http_scan"
    protocol: "http"
    enabled: true
    attempts: 5
    delay: 1
    
  - name: "mysql_bruteforce"
    protocol: "mysql"
    enabled: true
    attempts: 5
    delay: 2
    
  - name: "postgresql_scan"
    protocol: "postgresql"
    enabled: true
    attempts: 3
    delay: 2
    
  - name: "dns_tunneling"
    protocol: "dns"
    enabled: true
    attempts: 10
    delay: 1
    
  - name: "suspicious_domains"
    protocol: "http"
    enabled: true
    attempts: 8
    delay: 2
    
  - name: "port_scan"
    protocol: "scan"
    enabled: true
    attempts: 20
    delay: 0.5
    
  - name: "malformed_packets"
    protocol: "weird"
    enabled: true
    attempts: 5
    delay: 1

# Attack patterns
patterns:
  ssh:
    usernames: ["root", "admin", "user", "test", "ubuntu", "pi"]
    passwords: ["password", "123456", "admin", "root", "12345678", "qwerty", "letmein"]
    
  telnet:
    usernames: ["admin", "root", "user"]
    passwords: ["admin", "password", "1234"]
    
  ftp:
    usernames: ["anonymous", "ftp", "admin"]
    passwords: ["", "ftp", "admin"]
    
  mysql:
    usernames: ["root", "admin", "mysql"]
    passwords: ["", "root", "admin", "mysql"]
    
  postgresql:
    usernames: ["postgres", "admin", "user"]
    passwords: ["postgres", "admin", "password"]
    
  dns:
    # Suspicious domains for DNS queries
    domains:
      - "malware-c2-server.com"
      - "phishing-site.net"
      - "cryptominer.xyz"
      - "ransomware.download"
      - "botnet-command.org"
      - "exploit-kit.ru"
      - "data-exfil.tk"
      - "suspicious-tracking.cn"
    # DNS tunneling subdomains (encode data in DNS queries)
    tunnel_prefixes:
      - "exec-"
      - "cmd-"
      - "data-"
      - "exfil-"
    
  suspicious:
    # Known malicious domains
    domains:
      - "http://malware-distribution.com/payload.exe"
      - "http://phishing-login.net/steal.php"
      - "http://cryptojacking.xyz/miner.js"
      - "http://tor-exit-node.onion.ly/proxy"
      - "http://ddos-bot.ru/join"
      - "http://exploit-database.org/0day.zip"
    # Suspicious user agents
    user_agents:
      - "Wget/1.14"  # Automated tool
      - "curl/7.64.0"  # Command-line
      - "sqlmap/1.0"  # SQL injection tool
      - "Nikto/2.1.6"  # Vulnerability scanner
      - "Metasploit"  # Penetration testing
      - "() { :;}; /bin/bash"  # Shellshock exploit
    
  ports:
    # Common ports for scanning
    common: [21, 22, 23, 25, 80, 443, 3306, 5432, 8080]
    # Suspicious ports
    suspicious: [4444, 31337, 12345, 6667, 1337, 666]
    # High ports (ephemeral range)
    high: [50000, 54321, 55555, 60000, 65000]

# Simulation options
simulation:
  randomize_order: true  # Randomize attack order
  randomize_timing: true  # Add jitter to delays
  max_jitter: 3  # Max seconds to add to delays
  fake_user_agents: true  # Use random user agents for HTTP
  verbose: true  # Detailed logging
  save_results: true  # Save results to file
  output_dir: "./results"
