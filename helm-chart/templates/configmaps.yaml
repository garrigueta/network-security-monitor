{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ include "network-security-monitor.namespace" . }}
  labels:
    {{- include "network-security-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      # - "first_rules.yml"
      # - "second_rules.yml"
    
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']
      
      - job_name: 'crypto-exporter'
        static_configs:
          - targets: ['crypto-exporter:9101']
        scrape_interval: 60s
      
      {{- if .Values.honeypot.enabled }}
      - job_name: 'honeypot-node-exporter'
        static_configs:
          - targets: ['node-exporter-honeypot:9100']
      {{- end }}
      
      # Kubernetes cAdvisor metrics for container monitoring
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
{{- end }}
---
{{- if .Values.monitoring.loki.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ include "network-security-monitor.namespace" . }}
  labels:
    {{- include "network-security-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
data:
  loki-config.yml: |
    auth_enabled: false
    
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    
    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100
    
    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    
    ruler:
      alertmanager_url: http://localhost:9093
    
    limits_config:
      retention_period: 168h
      allow_structured_metadata: false
{{- end }}
---
{{- if .Values.monitoring.promtail.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: {{ include "network-security-monitor.namespace" . }}
  labels:
    {{- include "network-security-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: promtail
data:
  promtail-config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    
    positions:
      filename: /var/lib/promtail/positions.yaml
    
    clients:
      - url: http://loki:3100/loki/api/v1/push
    
    scrape_configs:
    {{- if .Values.zeek.enabled }}
      - job_name: zeek-logs
        static_configs:
          - targets:
              - localhost
            labels:
              job: zeek
              __path__: /mnt/ssd-logs/zeek/logs/current/*.log
        pipeline_stages:
          - json:
              expressions:
                ts: ts
                uid: uid
                id_orig_h: '["id.orig_h"]'
                id_resp_h: '["id.resp_h"]'
          - timestamp:
              source: ts
              format: Unix
    {{- end }}
    
    {{- if .Values.honeypot.enabled }}
      - job_name: cowrie-logs
        static_configs:
          - targets:
              - localhost
            labels:
              job: cowrie
              __path__: /mnt/ssd-logs/honeypot/cowrie/*.log
      
      - job_name: heralding-logs
        static_configs:
          - targets:
              - localhost
            labels:
              job: honeypot
              honeypot_type: heralding
              __path__: /mnt/ssd-logs/honeypot/heralding/*.json
        pipeline_stages:
          - json:
              expressions:
                timestamp: timestamp
                source_ip: source_ip
                destination_port: destination_port
                protocol: protocol
          - labels:
              source_ip:
              protocol:
    {{- end }}
    
    {{- if .Values.aiAgent.enabled }}
      - job_name: ai-agent-logs
        static_configs:
          - targets:
              - localhost
            labels:
              job: ai-agent
              application: ai-agent
              __path__: /mnt/ssd-logs/ai-agent/logs/*.log
        pipeline_stages:
          - json:
              expressions:
                timestamp: timestamp
                level: level
                event: event
                logger: logger
                action_type: action_type
                status: status
                source: source
                duration_ms: duration_ms
                error: error
                records_count: records_count
                metric: metric
                endpoint: endpoint
                method: method
                status_code: status_code
                report_type: report_type
                model: model
                prompt_length: prompt_length
                response_length: response_length
          - labels:
              level:
              event:
              action_type:
              status:
              source:
              endpoint:
              model:
          - timestamp:
              source: timestamp
              format: RFC3339
    {{- end }}
{{- end }}
---
{{- if .Values.zeek.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: zeek-config
  namespace: {{ include "network-security-monitor.namespace" . }}
  labels:
    {{- include "network-security-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: zeek
data:
  local.zeek: |
    # Local Zeek configuration  
    @load base/frameworks/software
    @load base/protocols/conn
    @load base/protocols/dns
    @load base/protocols/http
    @load base/protocols/ssl
    @load base/protocols/ssh
    @load base/protocols/ftp
    @load base/protocols/smtp
    
    # Security policies
    @load policy/protocols/conn/known-hosts
    @load policy/protocols/conn/known-services
    @load policy/protocols/ssl/known-certs
    @load policy/protocols/ssl/validate-certs
    @load policy/protocols/ssh/detect-bruteforcing
    
    # Security monitoring
    @load policy/misc/detect-traceroute
    @load policy/misc/scan
    
    # Enable JSON logs
    @load tuning/json-logs
    
    # Write logs to files (not stdout)
    redef LogAscii::output_to_stdout = F;
    redef LogAscii::include_meta = T;
{{- end }}