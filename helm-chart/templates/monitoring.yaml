{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ include "network-security-monitor.namespace" . }}
  labels:
    {{- include "network-security-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "network-security-monitor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "network-security-monitor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
      - name: prometheus
        image: "{{ .Values.global.imageRegistry }}{{ .Values.monitoring.prometheus.image.repository }}:{{ .Values.monitoring.prometheus.image.tag }}"
        imagePullPolicy: {{ .Values.monitoring.prometheus.image.pullPolicy }}
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--web.console.libraries=/usr/share/prometheus/console_libraries'
          - '--web.console.templates=/usr/share/prometheus/consoles'
          - '--storage.tsdb.retention.time={{ .Values.monitoring.prometheus.retention }}'
        ports:
        - containerPort: {{ .Values.monitoring.prometheus.service.port }}
          name: web
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        resources:
          {{- toYaml .Values.monitoring.prometheus.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ include "network-security-monitor.namespace" . }}
  labels:
    {{- include "network-security-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: {{ .Values.monitoring.prometheus.service.type }}
  ports:
  - port: {{ .Values.monitoring.prometheus.service.port }}
    targetPort: {{ .Values.monitoring.prometheus.service.port }}
    name: web
  selector:
    {{- include "network-security-monitor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
{{- end }}

---

{{- if .Values.monitoring.loki.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ include "network-security-monitor.namespace" . }}
  labels:
    {{- include "network-security-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "network-security-monitor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: loki
  template:
    metadata:
      labels:
        {{- include "network-security-monitor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: loki
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command: ['sh', '-c', 'chown -R 10001:10001 /loki && chmod -R 755 /loki']
        volumeMounts:
        - name: data
          mountPath: /loki
        securityContext:
          runAsUser: 0
      containers:
      - name: loki
        image: "{{ .Values.global.imageRegistry }}{{ .Values.monitoring.loki.image.repository }}:{{ .Values.monitoring.loki.image.tag }}"
        imagePullPolicy: {{ .Values.monitoring.loki.image.pullPolicy }}
        args:
          - -config.file=/etc/loki/loki-config.yml
        ports:
        - containerPort: {{ .Values.monitoring.loki.service.port }}
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: data
          mountPath: /loki
        resources:
          {{- toYaml .Values.monitoring.loki.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: data
        persistentVolumeClaim:
          claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ include "network-security-monitor.namespace" . }}
  labels:
    {{- include "network-security-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  type: {{ .Values.monitoring.loki.service.type }}
  ports:
  - port: {{ .Values.monitoring.loki.service.port }}
    targetPort: {{ .Values.monitoring.loki.service.port }}
    name: http
  selector:
    {{- include "network-security-monitor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: loki
{{- end }}

---

{{- if .Values.monitoring.promtail.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promtail
  namespace: {{ include "network-security-monitor.namespace" . }}
  labels:
    {{- include "network-security-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: promtail
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "network-security-monitor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: promtail
  template:
    metadata:
      labels:
        {{- include "network-security-monitor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: promtail
    spec:
      containers:
      - name: promtail
        image: "{{ .Values.global.imageRegistry }}{{ .Values.monitoring.promtail.image.repository }}:{{ .Values.monitoring.promtail.image.tag }}"
        imagePullPolicy: {{ .Values.monitoring.promtail.image.pullPolicy }}
        args:
          - -config.file=/etc/promtail/promtail-config.yml
        volumeMounts:
        - name: config
          mountPath: /etc/promtail
        - name: zeek-logs
          mountPath: /mnt/zeek-logs
          readOnly: true
        - name: honeypot-logs
          mountPath: /mnt/honeypot-logs
          readOnly: true
        resources:
          {{- toYaml .Values.monitoring.promtail.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: promtail-config
      - name: zeek-logs
        persistentVolumeClaim:
          claimName: zeek-logs
      - name: honeypot-logs
        persistentVolumeClaim:
          claimName: honeypot-logs
{{- end }}