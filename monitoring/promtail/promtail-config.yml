server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Zeek connection logs
  - job_name: zeek_conn
    static_configs:
      - targets:
          - localhost
        labels:
          job: zeek
          log_type: conn
          __path__: /mnt/ssd-logs/zeek/logs/current/conn.log

  # Zeek DNS logs
  - job_name: zeek_dns
    static_configs:
      - targets:
          - localhost
        labels:
          job: zeek
          log_type: dns
          __path__: /mnt/ssd-logs/zeek/logs/current/dns.log

  # Zeek HTTP logs
  - job_name: zeek_http
    static_configs:
      - targets:
          - localhost
        labels:
          job: zeek
          log_type: http
          __path__: /mnt/ssd-logs/zeek/logs/current/http.log

  # Zeek SSL logs
  - job_name: zeek_ssl
    static_configs:
      - targets:
          - localhost
        labels:
          job: zeek
          log_type: ssl
          __path__: /mnt/ssd-logs/zeek/logs/current/ssl.log

  # All Zeek logs (fallback)
  - job_name: zeek_all
    static_configs:
      - targets:
          - localhost
        labels:
          job: zeek
          __path__: /mnt/ssd-logs/zeek/logs/current/*.log

  # AI Agent structured logs
  - job_name: ai_agent
    static_configs:
      - targets:
          - localhost
        labels:
          job: ai-agent
          application: ai-agent
          log_type: structured
          __path__: /mnt/ssd-logs/ai-agent/actions.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            event: event
            level: level
            status: status
            duration_ms: duration_ms
            source: source
            endpoint: endpoint
            model: model
            operation: operation
            records_count: records_count
            severity: severity
            pattern_name: pattern_name
            source_ip: source_ip
            confidence: confidence
            status_code: status_code
            error: error
      - labels:
          event:
          level:
          status:
          source:
          endpoint:
          model:
          severity:
          pattern_name:
      - timestamp:
          source: timestamp
          format: RFC3339
      - output:
          source: message
