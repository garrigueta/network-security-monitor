services:
  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: "65534:65534"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/ssd-logs/prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
    restart: unless-stopped

  # Node Exporter - System metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - monitoring
    restart: unless-stopped

  # Crypto Price Exporter
  crypto-exporter:
    build:
      context: ./crypto-exporter
      dockerfile: Dockerfile
    container_name: crypto-exporter
    ports:
      - "9101:9101"
    networks:
      - monitoring
    restart: unless-stopped

  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: loki
    user: "10001:10001"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - /mnt/ssd-logs/loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring
    restart: unless-stopped

  # Promtail - Log collection for Zeek
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /mnt/ssd-logs/zeek-logs:/mnt/zeek-logs:ro
      - /mnt/ssd-logs/promtail-positions:/var/lib/promtail
    networks:
      - monitoring
    depends_on:
      - loki
    restart: unless-stopped

  # Zeek - Network Security Monitor
  zeek:
    build:
      context: ./zeek
      dockerfile: Dockerfile
    container_name: zeek
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /mnt/ssd-logs/zeek-logs:/mnt/zeek-logs
      - ./zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
    environment:
      - ZEEK_INTERFACE=eth1
    restart: unless-stopped

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "472:472"
    volumes:
      - /mnt/ssd-logs/grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards/crypto-prices.json:/etc/grafana/dashboards/crypto-prices.json:ro
      - ./grafana/dashboards/zeek-complete-analysis.json:/etc/grafana/dashboards/zeek-complete-analysis.json:ro
      - ./grafana/dashboards/zeek-connection-analysis.json:/etc/grafana/dashboards/zeek-connection-analysis.json:ro
      - ./grafana/dashboards/zeek-dns-security-analysis.json:/etc/grafana/dashboards/zeek-dns-security-analysis.json:ro
      - ./grafana/dashboards/zeek-security-overview.json:/etc/grafana/dashboards/zeek-security-overview.json:ro
      - ./grafana/dashboards/zeek-ssd-io.json:/etc/grafana/dashboards/zeek-ssd-io.json:ro
      - ./grafana/dashboards/zeek-ssd-storage.json:/etc/grafana/dashboards/zeek-ssd-storage.json:ro
      - ./grafana/dashboards/zeek-ssl-tls-analysis.json:/etc/grafana/dashboards/zeek-ssl-tls-analysis.json:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

# Note: Using SSD mount points instead of Docker volumes for better performance
# All data will be stored on /mnt/ssd-logs/
# Ensure SSD is mounted before starting services
