[dionaea]
download.dir = /opt/dionaea/var/lib/dionaea/binaries/
modules.python.dir = /opt/dionaea/lib/dionaea/python/
modules.dir = /opt/dionaea/lib/dionaea/
processors.dir = /opt/dionaea/lib/dionaea/processors/

[logging]
default.filename = /opt/dionaea/var/log/dionaea.log
default.levels = all
default.domains = *

[module.ftp]
root = /opt/dionaea/var/lib/dionaea/roots/ftp

[module.smb]
root = /opt/dionaea/var/lib/dionaea/roots/smb

[module.http]
root = /opt/dionaea/var/lib/dionaea/roots/www
ssl.default.c = US
ssl.default.cn = www.example.com
ssl.default.o = Example Inc
ssl.default.ou = IT Department

[module.mysql]
databases.information_schema.enabled = true
databases.mysql.enabled = true

[module.mssql]
enable = true
