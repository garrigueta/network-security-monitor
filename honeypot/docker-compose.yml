services:
  # Cowrie SSH/Telnet Honeypot
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    hostname: honeypot-ssh
    ports:
      - "2222:2222"    # SSH honeypot
      - "2223:2223"    # Telnet honeypot
    volumes:
      - /mnt/ssd-logs/honeypot-logs/cowrie:/cowrie/cowrie-git/var/log/cowrie
      - cowrie-downloads:/cowrie/cowrie-git/var/lib/cowrie/downloads
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
    networks:
      - honeypot
    restart: unless-stopped

  # Heralding - Multi-protocol credential honeypot (ARM64 compatible)
  heralding:
    image: heywoodlh/heralding:latest
    container_name: heralding
    hostname: honeypot-services
    ports:
      - "21:21"      # FTP
      - "23:23"      # Telnet  
      - "25:25"      # SMTP
      - "80:80"      # HTTP
      - "110:110"    # POP3
      - "143:143"    # IMAP
      - "443:443"    # HTTPS
      - "993:993"    # IMAPS
      - "995:995"    # POP3S
      - "1080:1080"  # SOCKS5
      - "3306:3306"  # MySQL
      - "5432:5432"  # PostgreSQL
      - "5900:5900"  # VNC
    volumes:
      - /mnt/ssd-logs/honeypot-logs/heralding:/var/log/heralding
    networks:
      - honeypot
    restart: unless-stopped
    command: >
      bash -c "ln -sf /var/log/heralding/log_auth.csv /log_auth.csv &&
               ln -sf /var/log/heralding/log_session.csv /log_session.csv &&
               ln -sf /var/log/heralding/log_session.json /log_session.json &&
               heralding"

  # HoneyTrap Network Service Honeypot - DISABLED (not ARM64 compatible)
  # honeytrap:
  #   image: honeytrap/honeytrap:latest
  #   container_name: honeytrap
  #   hostname: honeypot-services
  #   network_mode: host
  #   cap_add:
  #     - NET_ADMIN
  #     - NET_RAW
  #   volumes:
  #     - honeytrap-logs:/var/log/honeytrap
  #     - ./honeytrap/honeytrap.yml:/etc/honeytrap/honeytrap.yml:ro
  #   restart: unless-stopped

  # Promtail - Ship logs to central Loki
  promtail:
    image: grafana/promtail:latest
    container_name: promtail-honeypot
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /mnt/ssd-logs/honeypot-logs/cowrie:/var/log/cowrie:ro
      - /mnt/ssd-logs/honeypot-logs/heralding:/var/log/heralding:ro
      # - honeytrap-logs:/var/log/honeytrap:ro
      - /mnt/ssd-logs/promtail-positions:/var/lib/promtail
    networks:
      - honeypot
      - monitoring_monitoring
    depends_on:
      - cowrie
      - heralding
    restart: unless-stopped
    environment:
      - LOKI_URL=${LOKI_URL:-http://192.168.1.100:3100}

  # Prometheus Node Exporter for honeypot host metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-honeypot
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9102:9100"
    networks:
      - honeypot
    restart: unless-stopped

networks:
  honeypot:
    driver: bridge
  monitoring_monitoring:
    external: true

volumes:
  cowrie-logs:
  cowrie-downloads:
  heralding-logs:
  honeytrap-logs:
  promtail-positions:
