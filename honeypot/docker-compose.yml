version: '3.8'

services:
  # Cowrie SSH/Telnet Honeypot
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    hostname: honeypot-ssh
    ports:
      - "2222:2222"    # SSH honeypot
      - "2223:2223"    # Telnet honeypot
    volumes:
      - cowrie-logs:/cowrie/cowrie-git/var/log/cowrie
      - cowrie-downloads:/cowrie/cowrie-git/var/lib/cowrie/downloads
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
    networks:
      - honeypot
    restart: unless-stopped

  # Dionaea Malware Honeypot
  dionaea:
    image: dinotools/dionaea:latest
    container_name: dionaea
    hostname: honeypot-malware
    ports:
      - "21:21"      # FTP
      - "42:42"      # WINS
      - "135:135"    # MS-RPC
      - "445:445"    # SMB
      - "1433:1433"  # MSSQL
      - "3306:3306"  # MySQL
      - "5060:5060"  # SIP
      - "5061:5061"  # SIP-TLS
    volumes:
      - dionaea-logs:/opt/dionaea/var/log
      - dionaea-binaries:/opt/dionaea/var/lib/dionaea/binaries
      - ./dionaea/dionaea.cfg:/opt/dionaea/etc/dionaea/dionaea.cfg:ro
    networks:
      - honeypot
    restart: unless-stopped

  # HoneyTrap Network Service Honeypot
  honeytrap:
    image: honeytrap/honeytrap:latest
    container_name: honeytrap
    hostname: honeypot-services
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - honeytrap-logs:/var/log/honeytrap
      - ./honeytrap/honeytrap.yml:/etc/honeytrap/honeytrap.yml:ro
    restart: unless-stopped

  # Promtail - Ship logs to central Loki
  promtail:
    image: grafana/promtail:latest
    container_name: promtail-honeypot
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - cowrie-logs:/var/log/cowrie:ro
      - dionaea-logs:/var/log/dionaea:ro
      - honeytrap-logs:/var/log/honeytrap:ro
      - promtail-positions:/var/lib/promtail
    networks:
      - honeypot
    depends_on:
      - cowrie
      - dionaea
    restart: unless-stopped
    environment:
      - LOKI_URL=${LOKI_URL:-http://192.168.1.100:3100}

  # Prometheus Node Exporter for honeypot host metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-honeypot
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - honeypot
    restart: unless-stopped

networks:
  honeypot:
    driver: bridge

volumes:
  cowrie-logs:
  cowrie-downloads:
  dionaea-logs:
  dionaea-binaries:
  honeytrap-logs:
  promtail-positions:
