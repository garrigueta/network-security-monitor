server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://192.168.1.135:3100/loki/api/v1/push

scrape_configs:
  # Cowrie SSH/Telnet honeypot logs
  - job_name: honeypot-cowrie
    static_configs:
      - targets:
          - localhost
        labels:
          job: honeypot
          service: cowrie
          __path__: /var/log/cowrie/*.log

  # Cowrie JSON logs  
  - job_name: honeypot-cowrie-json
    static_configs:
      - targets:
          - localhost
        labels:
          job: honeypot
          service: cowrie
          __path__: /var/log/cowrie/*.json